<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вкус Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        a{
            display: flex;
            margin-bottom: 20px;
        }
        .question {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .options {
            list-style-type: none;
            padding: 0;
        }
        .options li {
            margin: 10px 0;
            background-color: #f2f2f2;
            padding: 10px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
        .options li:hover {
            background-color: #e2e2e2;
        }
        .correct-answer {
            color: green;
            font-size: 20px;
            margin-top: 20px;
        }
        .incorrect-answer {
            color: red;
            font-size: 20px;
            margin-top: 20px;
        }
        .next-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .next-btn:hover {
            background-color: #45a049;
        }
        .result {
            font-size: 24px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <a href="index.html">На главную</a>
    <div class="question">Какой вкус?</div>
    <ul class="options">
    </ul>
    <div class="correct-answer"></div>
    <div class="incorrect-answer"></div>
    <button class="next-btn" onclick="nextQuestion()">Следующий вопрос</button>
    <div class="result"></div>

    <script>
 const data = [
  { flavor: "After 8", taste: "Шоколадно-мятные конфеты" },
  { flavor: "Almond ice cream", taste: "Миндальное мороженое" },
  { flavor: "Ananas shock", taste: "Кислый ананас" },
  { flavor: "Apple shock", taste: "Кислое яблоко" },
  { flavor: "Asian lychee", taste: "Личи" },
  { flavor: "Barberry shock", taste: "Кислый барбарис" },
  { flavor: "Basilic", taste: "Базилик" },
  { flavor: "Berry lemonade", taste: "Ягодный лимонад" },
  { flavor: "Black honey", taste: "Цветочный мёд" },
  { flavor: "Blackberry lemonade", taste: "Ежевичный лимонад" },
  { flavor: "Brownie", taste: "Брауни" },
  { flavor: "Cane mint", taste: "Тростниковая мята" },
  { flavor: "Cheesecake", taste: "Чизкейк" },
  { flavor: "Cherry garden", taste: "Черешневый сок" },
  { flavor: "Cherry shock", taste: "Кислая вишня" },
  { flavor: "Chupa graper", taste: "Виноградный чупа-чупс" },
  { flavor: "Cranberry shock", taste: "Кислая клюква" },
  { flavor: "Creme brulee", taste: "Крем-брюле" },
  { flavor: "Ekzo mango", taste: "Экзотический манго" },
  { flavor: "Elderberry shock", taste: "Кислая бузина" },
  { flavor: "Ёлка", taste: "Ёлка" },
  { flavor: "Epic yogurt", taste: "Черничный йогурт" },
  { flavor: "Etalon melon", taste: "Медовая дыня" },
  { flavor: "Famous apple", taste: "Ледяное зелёное яблоко" },
  { flavor: "Feijoa jam", taste: "Варенье из фейхоа" },
  { flavor: "Garnet", taste: "Гранат" },
  { flavor: "Green tea", taste: "Зелёный чай" },
  { flavor: "Haribon", taste: "Мармеладная кола" },
  { flavor: "Ice baby", taste: "Ягодный сорбет с грейпфрутом" },
  { flavor: "Iceberg", taste: "Лёд" },
  { flavor: "Irish cream", taste: "Ирландский сливочный ликёр" },
  { flavor: "It's not black currant", taste: "Красная смородина" },
  { flavor: "Juicy smoothie", taste: "Тропический смузи" },
  { flavor: "Kiwi stoner", taste: "Смузи из киви" },
  { flavor: "Lemon shock", taste: "Кислый лимон" },
  { flavor: "Lemon sweets", taste: "Лимонные леденцы" }
];


        function shuffleQuestions(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        shuffleQuestions(data);

        let currentQuestionIndex = 0;
        let score = 0;

        function getRandomQuestion() {
            const questionData = data[currentQuestionIndex];
            const correctAnswer = questionData.taste;

            let wrongAnswers = [];
            while (wrongAnswers.length < 3) {
                const randomData = data[Math.floor(Math.random() * data.length)];
                if (wrongAnswers.indexOf(randomData.taste) === -1 && randomData.taste !== correctAnswer) {
                    wrongAnswers.push(randomData.taste);
                }
            }

            const allAnswers = [correctAnswer, ...wrongAnswers];
            allAnswers.sort(() => Math.random() - 0.5);

            return {
                question: questionData.flavor,
                correctAnswer: correctAnswer,
                allAnswers: allAnswers
            };
        }

        function displayQuestion() {
            if (currentQuestionIndex >= data.length) {
                displayResult();
                return;
            }

            document.querySelector('.correct-answer').style.display = 'none';
            document.querySelector('.incorrect-answer').style.display = 'none';

            const { question, correctAnswer, allAnswers } = getRandomQuestion();


            document.querySelector('.question').textContent = `Какой вкус для "${question}"?`;


            const optionsList = document.querySelector('.options');
            optionsList.innerHTML = '';

            allAnswers.forEach(answer => {
                const li = document.createElement('li');
                li.textContent = answer;
                li.addEventListener('click', () => showCorrectAnswer(answer, correctAnswer));
                optionsList.appendChild(li);
            });
        }

        function showCorrectAnswer(selectedAnswer, correctAnswer) {
            const correctAnswerDiv = document.querySelector('.correct-answer');
            const incorrectAnswerDiv = document.querySelector('.incorrect-answer');

            if (selectedAnswer === correctAnswer) {
                score++;
                correctAnswerDiv.textContent = `Правильный ответ: ${correctAnswer}`;
                correctAnswerDiv.style.color = 'green';
                correctAnswerDiv.style.display = 'block';
            } else {
                incorrectAnswerDiv.textContent = `Неправильный ответ! Правильный: ${correctAnswer}`;
                incorrectAnswerDiv.style.color = 'red';
                incorrectAnswerDiv.style.display = 'block';
            }


            const options = document.querySelectorAll('.options li');
            options.forEach(option => {
                option.style.pointerEvents = 'none';
            });

            document.querySelector('.next-btn').style.display = 'inline-block'; 
        }

        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
            document.querySelector('.next-btn').style.display = 'none'; 
        }

        function displayResult() {
            document.querySelector('.question').style.display = 'none';
            document.querySelector('.options').style.display = 'none';
            document.querySelector('.next-btn').style.display = 'none';

            const resultDiv = document.querySelector('.result');
            resultDiv.textContent = `Вы ответили правильно на ${score} из ${data.length} вопросов!`;
        }

        displayQuestion();
    </script>
</body>
</html>
